[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nordvik-wx-orchestrate-poc"
version = "1.2.0"
description = "Norvik Industries AB — watsonx Orchestrate HR Automation PoC (IBM Client Engineering)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "IBM Client Engineering", email = "ce-emea@ibm.com" },
]
keywords = ["watsonx", "orchestrate", "ibm", "hr-automation", "sap", "azure"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
